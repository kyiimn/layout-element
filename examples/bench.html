<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>Layout Element Benchmark</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f0f0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  </style>
</head>

<body>
  <x-layout-document id="doc">
    <x-layout-page id="page"></x-layout-page>
  </x-layout-document>

  <script type="module">
    import "/src/index.ts";

    import { ColorRegistry } from "/src/resource/color-registry";
    import { FontLoader } from "/src/resource/font-loader";
    import { SelectionRange } from "/src/types/edit/selection.type";

    (async () => {
      await ColorRegistry.getInstance().init();
      await FontLoader.getInstance().init();

      const page = document.getElementById("page");

      // 신문 기사 본문 (약 2000자)
      const body = `서민금융진흥원이 이재명 정부 국정과제 중 하나인 사회연대경제 성장 지원을 위해 사회적기업 관련 대출 규모를 늘린다. 이와 함께 정부에서 강조하고 있는 포용금융 강화를 위해 비금융 대안정보를 활용한 평가모형 개발에도 나선다. 국회 정무위원회 소속 의원실에 따르면 서금원은 이 같은 내용을 담은 업무계획을 금융위원회에 제출했다. 올해 서금원은 사회적금융 활성화를 위해 사회적기업 대출 규모를 기존 60억원에서 150억원으로 확대한다. 대출사업 수행기관 등 민간사업수행기관 신규 발굴 및 선정도 추진한다. 서금원은 미소금융 기업이나 은행재단 등 사업수행기관을 통해 2018년부터 사회적기업이나 사회적협동조합에 자금을 대출하고 있다. 미소금융이란 담보나 신용이 없어 제도권 금융을 이용하기 어려운 취약계층을 대상으로 창업 및 운영자금 등을 지원하는 소액대출사업을 말한다. 서금원이 취급하는 미소금융 사회연대금융 대출의 경우 연 매출 5억원 이하의 사회적기업이나 협동조합이 대상이며 대출한도는 최대 1억원, 금리는 연 4.5% 이내다. 비금융 대안정보를 활용한 평가모형 개발에도 나선다. 비금융 서민 대안 신용평가모형을 개발해 서금원이 취급하는 상품의 대출심사에 활용한다는 계획이다. 평가모형에는 최저신용자나 플랫폼 노동자의 성실 상환 여부, 금융교육 이수 여부, 서금원 컨설팅 이용 여부 등을 반영한다. 또 비금융 대안정보를 활용한 상환능력 평가도 개선한다. 기존에는 통합 신용평가모형에 대안정보로 산출한 점수를 가점하는 방식이었으나 개선안에서는 보증이 거절된 소비자를 추가로 선별하는 데 대안정보를 활용한다. 이를 통해 저신용자 지원은 강화하고 고액자산가의 대출 한도는 축소해 도덕적 해이를 최소화하겠다는 설명이다. 청년과 자영업자를 위한 컨설팅도 확대한다. 청년도약계좌 이용자를 위한 청년금융 컨설팅 기능을 청년 모두를 위한 재무상담으로 확대 및 개편한다. 예를 들어 서금원 통합지원센터를 기반으로 한 재무상담과 위촉 컨설턴트를 통해 찾아가는 컨설팅을 제공할 예정이다. 자영업자의 경우 서금원 자영업 지원센터를 구축해 세무 노무 법무 자영업 진단 컨설팅 등 비대면 컨설팅을 지원할 수 있는 환경을 마련할 계획이다. 신용관리가 취약할 수 있는 계층을 대상으로 한 신용 부채관리 컨설팅도 검토하고 있다. 휴면예금 찾아주기 서비스도 강화한다. 금융소비자는 서금원에 출연된 휴면예금을 돌려받을 수 있는데 소액의 경우 간편결제 서비스의 페이머니로 전환해 지급하는 방안을 추진한다. 한편 서금원은 올해 정책서민금융 공급액을 지난해와 동일한 6조8100억원으로 책정했다. 지난해와 다르게 햇살론 일반보증 공급액 1조원을 줄이는 대신 특례보증 공급액을 1조원 늘린 것이 특징이다.`;

      // 문서: 391×545mm, 6단
      // - 본문 문단 (absolute box, 3컬럼) — 텍스트 편집/스타일/정렬 벤치마크 대상
      // - 이미지 박스 (absolute) — 오버랩 이동 벤치마크 대상
      page.data = {
        id: "bench-page",
        width: 391,
        height: 545,
        paddingTop: 10,
        paddingBottom: 10,
        paddingLeft: 10,
        paddingRight: 10,
        columns: 6,
        gap: 5,
        paragraphStyle: { lineGap: 1.2 },
        textStyle: { fontSize: 4 },
        children: [
          {
            id: "bench-body-box",
            type: "box",
            position: "absolute",
            left: 10, top: 10,
            width: 371, height: 500,
            zIndex: 1,
            children: {
              id: "bench-body-para",
              type: "paragraph",
              content: body,
              column: 3,
              gap: 5,
              paragraphStyle: {},
              textStyle: {},
            },
          },
          {
            id: "bench-image-box",
            type: "box",
            position: "absolute",
            left: 250, top: 40,
            width: 120, height: 90,
            zIndex: 10,
            contentType: "image",
            children: {
              id: "bench-image",
              type: "image",
              url: "/examples/test/g10525mv.png",
              overlapMode: "path",
              overlapPadding: 2,
            },
          },
        ],
      };

      await page.render();

      const em = page.editManager;
      em.textEditMode = true;
      // 단계 5 canvas 기본값화 — 벤치마크가 DOM 경로 수치를 전제하므로 'dom' 고정.
      // canvas 실측은 시나리오 8f가 renderMode를 전환해 수행한다.
      for (const p of page.querySelectorAll("x-layout-paragraph")) p.renderMode = "dom";

      const paraBox = [...page.querySelectorAll("x-layout-box")].find(b => b.id === "bench-body-box");
      const imageBox = [...page.querySelectorAll("x-layout-box")].find(b => b.id === "bench-image-box");
      const para = () => paraBox.querySelector("x-layout-paragraph") || paraBox.contentElement;

      // render-complete 이벤트 Promise — 작업 완료 감지. 타임아웃 시 null 반환.
      function waitRenderComplete(timeoutMs = 1000) {
        return new Promise((resolve) => {
          let done = false;
          const onDone = (timedOut) => {
            if (done) return;
            done = true;
            para().removeEventListener("render-complete", onDone);
            resolve(timedOut ? null : performance.now());
          };
          para().addEventListener("render-complete", () => onDone(false));
          setTimeout(() => onDone(true), timeoutMs);
        });
      }

      // 문단 선택 후 포커스 — selection은 focusParagraph options로 전달
      async function focusPara(selStart, selEnd) {
        const p = para();
        if (!p.editableText) {
          p.editableText = true;
          await new Promise(r => setTimeout(r, 100));
        }
        let ok;
        if (selStart !== undefined) {
          ok = em.focusParagraph(p, { selection: SelectionRange.fromOffsets(selStart, selEnd) });
        } else {
          ok = em.focusParagraph(p);
        }
        await new Promise(r => setTimeout(r, 100));
        if (!ok) throw new Error("focusParagraph failed");
        return p;
      }

      // ── 벤치마크 API ──
      window.bench = {
        page,

        // 1. 텍스트 편집: 문단 끝 지속 타이핑 — 입력 동기 시간 + 프레임 시간 분리 측정
        async typeText(count) {
          const p = await focusPara();
          const controller = em._focusedController;
          const ta = controller?._textarea;

          const inputTimes = [];
          const frameDeltas = [];
          const chars = "가나다라마바사";
          let lastRafTs = 0;
          const raf = () => new Promise(r => requestAnimationFrame(ts => {
            if (lastRafTs > 0) frameDeltas.push(ts - lastRafTs);
            lastRafTs = ts;
            r();
          }));
          for (let i = 0; i < count; i++) {
            // 이전 키의 커밋(_debouncedRender rAF) + 지연 커서 갱신 + paint가
            // 모두 정착한 뒤 입력 — 실사용 패턴(키보드 이벤트는 paint 후 도착).
            await raf();
            await raf();

            const t0 = performance.now();
            if (ta) {
              const before = ta.value;
              const offset = ta.selectionStart ?? before.length;
              ta.value = before.slice(0, offset) + chars[i % chars.length] + before.slice(ta.selectionEnd ?? offset);
              ta.setSelectionRange(offset + 1, offset + 1);
              ta.dispatchEvent(new InputEvent("input", { bubbles: true }));
            } else {
              const cur = typeof p.content === "string" ? p.content : "";
              p.content = cur + chars[i % chars.length];
            }
            inputTimes.push(performance.now() - t0);
          }
          window.bench._lastTypingFrames = frameDeltas;
          return inputTimes;
        },

        // 2. 오버랩 항목(이미지 박스) 이동 — 렌더 완료까지 프레임 시간
        async moveImage(iterations) {
          const times = [];
          const origLeft = imageBox.left;
          for (let i = 0; i < iterations; i++) {
            const endPromise = waitRenderComplete();
            const t0 = performance.now();
            imageBox.left = origLeft + (i % 20) * 0.5;
            const tEnd = await endPromise;
            if (tEnd !== null) times.push(tEnd - t0);
            else times.push(performance.now() - t0); // 타임아웃 시에도 경과 시간 기록
          }
          imageBox.left = origLeft;
          await new Promise(r => setTimeout(r, 200));
          return times;
        },

        // 3. 인라인 스타일 주입: 절반 선택 → bold/italic/color 주입/해제
        async inlineStyle(count) {
          const controller = em._focusedController;
          const ta = controller?._textarea;
          if (!ta) throw new Error("textarea not available");

          const times = [];
          const styles = [
            { fontWeight: 700 },
            { fontStyle: "italic" },
            { color: "blue" },
            { fontWeight: undefined },
            { fontStyle: undefined },
            { color: undefined },
          ];
          const half = Math.floor(ta.value.length / 2);
          for (let i = 0; i < count; i++) {
            await focusPara(0, half);
            const endPromise = waitRenderComplete();
            const t0 = performance.now();
            em.applyInlineStyle(styles[i % styles.length]);
            const tEnd = await endPromise;
            if (tEnd !== null) times.push(tEnd - t0);
            // 지연된 커서/선택 갱신 rAF가 정착한 뒤 다음 iteration 진입
            await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
          }
          return times;
        },

        // 4. 인라인 글자크기: 절반 선택 → 크기 지정/수정/제거
        async inlineFontSize(count) {
          const controller = em._focusedController;
          const ta = controller?._textarea;
          if (!ta) throw new Error("textarea not available");

          const times = [];
          const sizes = [5, 6, undefined];
          const half = Math.floor(ta.value.length / 2);
          for (let i = 0; i < count; i++) {
            await focusPara(0, half);
            const endPromise = waitRenderComplete();
            const t0 = performance.now();
            em.applyInlineStyle({ fontSize: sizes[i % sizes.length] });
            const tEnd = await endPromise;
            if (tEnd !== null) times.push(tEnd - t0);
            await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
          }
          return times;
        },

        // 5. 문단 정렬 변경 — 렌더 완료까지 동기 시간
        async alignChange(count) {
          const aligns = ["justify", "left", "center", "right", "justify"];
          const times = [];
          for (let i = 0; i < count; i++) {
            const endPromise = waitRenderComplete();
            const t0 = performance.now();
            para().paragraphStyle = { textAlign: aligns[i % aligns.length] };
            const tEnd = await endPromise;
            if (tEnd !== null) times.push(tEnd - t0);
            await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
          }
          return times;
        },

        // 6. 분해 계측: 인라인 스타일 시나리오의 단계별 시간
        async breakdownInlineStyle(count) {
          const controller = em._focusedController;
          const ta = controller?._textarea;
          if (!ta) throw new Error("textarea not available");
          const half = Math.floor(ta.value.length / 2);

          const focusTimes = [];
          const applyTimes = [];
          const totalTimes = [];
          for (let i = 0; i < count; i++) {
            const tTotal0 = performance.now();

            // focus+selection 측정 (대기 없이 순수 동기 시간만)
            const tF0 = performance.now();
            em.focusParagraph(para(), { selection: SelectionRange.fromOffsets(0, half) });
            focusTimes.push(performance.now() - tF0);

            const tA0 = performance.now();
            em.applyInlineStyle(i % 2 === 0 ? { fontWeight: 700 } : { fontWeight: undefined });
            applyTimes.push(performance.now() - tA0);

            await new Promise(r => setTimeout(r, 30));
            totalTimes.push(performance.now() - tTotal0);
          }
          return { focusTimes, applyTimes, totalTimes };
        },

        // 7. 분해 계측: applyInlineStyle 파이프라인 단계별 동기 시간
        async breakdownApplyStyle(count) {
          const controller = em._focusedController;
          const ta = controller?._textarea;
          if (!ta) throw new Error("textarea not available");
          const half = Math.floor(ta.value.length / 2);
          const { applyStyleToRange, plainToInline } = await import("/src/edit/run-map");

          const engine = para().engine;
          const model = para().model;
          const t = {
            runMap: [], textContentSetter: [], layoutText: [], renderText: [],
            cacheHit: [], full: [],
          };
          for (let i = 0; i < count; i++) {
            em.focusParagraph(para(), { selection: SelectionRange.fromOffsets(0, half) });
            await new Promise(r => setTimeout(r, 30));

            const t0 = performance.now();
            const runMap = applyStyleToRange(controller._runMap, 0, half, { fontWeight: 700 });
            const inline = plainToInline(ta.value, runMap);
            t.runMap.push(performance.now() - t0);

            let t1 = performance.now();
            model.textContent = inline;
            t.textContentSetter.push(performance.now() - t1);

            t.cacheHit.push(engine.hasLayoutCache);

            t1 = performance.now();
            engine.layoutText();
            t.layoutText.push(performance.now() - t1);

            const columns = para().querySelectorAll("x-layout-column");
            t1 = performance.now();
            columns.forEach(c => c.renderText());
            t.renderText.push(performance.now() - t1);

            t.full.push(performance.now() - t0);

            // 원복
            controller._runMap = applyStyleToRange(runMap, 0, half, { fontWeight: undefined });
            model.textContent = plainToInline(ta.value, controller._runMap);
            engine.layoutText();
            columns.forEach(c => c.renderText());
            await new Promise(r => setTimeout(r, 30));
          }
          return t;
        },

        getParaBox: () => paraBox,
        getImageBox: () => imageBox,
        getEditManager: () => em,

        // ── 8. 대규모 문서 가상화 (300p + 마운트/언마운트) ──
        // 시나리오 8 전용 네임스페이스. 기존 bench 문서를 교체하므로
        // benchmark-browser.mjs에서 마지막에 실행한다.
        large: {
          pageIds: [],
          paraIds: [],
          _unit: "가상화 측정용 기준 문장입니다. 수백 페이지 문서의 마운트 윈도우와 재마운트 비용을 잰다. ",
          _text(chars) {
            let s = "";
            while (s.length < chars) s += this._unit;
            return s.slice(0, chars);
          },
          // 8a. N페이지 문서 빌드 (data assign) — top-level absolute 박스 + 문단
          async buildLargeDoc(pageCount = 300, charsPerPage = 600) {
            const PITCH = 300, PH = 280;
            const children = [];
            this.pageIds = [];
            this.paraIds = [];
            for (let i = 0; i < pageCount; i++) {
              const boxId = `bigpage-${i}`;
              const paraId = `bigpage-${i}-para`;
              this.pageIds.push(boxId);
              this.paraIds.push(paraId);
              children.push({
                type: "box",
                id: boxId,
                position: "absolute",
                left: 10, top: i * PITCH,
                width: 170, height: PH,
                children: {
                  type: "paragraph",
                  id: paraId,
                  content: this._text(charsPerPage),
                  paragraphStyle: {},
                  textStyle: {},
                },
              });
            }
            const t0 = performance.now();
            page.data = {
              id: "bench-large-page",
              width: 190,
              height: pageCount * PITCH,
              columns: 1,
              gap: 0,
              paragraphStyle: { lineGap: 1.2 },
              textStyle: { fontSize: 4 },
              children,
            };
            const assignMs = performance.now() - t0;
            return { pageCount, assignMs };
          },
          // span 집계 (섀도우 DOM 관통 — verify-virtualization J와 동일 정의)
          countSpans() {
            let n = 0;
            for (const col of page.querySelectorAll("x-layout-column")) {
              n += col.shadowRoot.querySelectorAll("span[data-source-offset]").length;
            }
            return n;
          },
          countNodes() {
            return document.querySelectorAll("*").length;
          },
          async memoryMB() {
            try { window.gc?.(); } catch { /* --expose-gc 없이도 동작 */ }
            await new Promise(r => setTimeout(r, 300));
            const heap = performance.memory?.usedJSHeapSize;
            return heap === undefined ? null : heap / 1048576;
          },
          // 8b. 전체 렌더 (풀마운트 기준선 — 시간 초과 시 호출자에서 infeasible 판정)
          async renderAll() {
            const t0 = performance.now();
            await page.render();
            return { renderMs: performance.now() - t0, spans: this.countSpans(), nodes: this.countNodes() };
          },
          // 8c. 윈도우 외 전부 park (footprint 유지 — PageMountManager와 동일 방식)
          async parkAllBut(keepIds) {
            const keep = new Set(keepIds);
            const t0 = performance.now();
            let parked = 0;
            for (const id of this.pageIds) {
              if (keep.has(id)) continue;
              const box = [...page.querySelectorAll("x-layout-box")].find(b => b.id === id);
              const h = box ? box.offsetHeight : 0;
              const ph = page.parkPage(id);
              if (ph) {
                if (h > 0) ph.style.height = `${h}px`;
                parked++;
              }
            }
            const parkMs = performance.now() - t0;
            return { parkMs, parked, spans: this.countSpans(), nodes: this.countNodes() };
          },
          // 8d. 재마운트 사이클 (unpark + render, 페이지별 시간)
          async remountCycle(ids) {
            const times = [];
            for (const id of ids) {
              const t0 = performance.now();
              const box = page.unparkPage(id);
              if (box) await box.render();
              times.push(performance.now() - t0);
            }
            return times;
          },
          // 8e. 마운트 페이지 타이핑 (typeText와 동일 패턴 — 입력 동기 + 프레임 델타)
          async typeInPage(pageIdx, count) {
            let box = [...page.querySelectorAll("x-layout-box")].find(b => b.id === this.pageIds[pageIdx]);
            if (!box) {
              const restored = page.unparkPage(this.pageIds[pageIdx]);
              if (restored) await restored.render();
              box = [...page.querySelectorAll("x-layout-box")].find(b => b.id === this.pageIds[pageIdx]);
            }
            const p = box.querySelector("x-layout-paragraph");
            if (!p.editableText) {
              p.editableText = true;
              await new Promise(r => setTimeout(r, 100));
            }
            em.focusParagraph(p);
            await new Promise(r => setTimeout(r, 100));
            const controller = em._focusedController;
            const ta = controller?._textarea;
            const inputTimes = [];
            const frameDeltas = [];
            const chars = "가나다라마바사";
            let lastRafTs = 0;
            const raf = () => new Promise(r => requestAnimationFrame(ts => {
              if (lastRafTs > 0) frameDeltas.push(ts - lastRafTs);
              lastRafTs = ts;
              r();
            }));
            for (let i = 0; i < count; i++) {
              await raf();
              await raf();
              const t0 = performance.now();
              if (ta) {
                const before = ta.value;
                const offset = ta.selectionStart ?? before.length;
                ta.value = before.slice(0, offset) + chars[i % chars.length] + before.slice(ta.selectionEnd ?? offset);
                ta.setSelectionRange(offset + 1, offset + 1);
                ta.dispatchEvent(new InputEvent("input", { bubbles: true }));
              }
              inputTimes.push(performance.now() - t0);
            }
            return { inputTimes, frameDeltas };
          },

          // CANVAS_RENDERING.md 단계 4 — 윈도우 3p의 비-포커스 문단을 canvas로
          // 전환한다(하이브리드 계약: 포커스 문단은 자동 DOM 복귀). 전환 후
          // span 수와 전환 시간을 반환한다.
          async canvasSwitch() {
            const t0 = performance.now();
            let canvases = 0;
            for (const pageIdx of [0, 1, 2]) {
              const box = [...page.querySelectorAll("x-layout-box")].find(b => b.id === this.pageIds[pageIdx])
                ?? (() => { const r = page.unparkPage(this.pageIds[pageIdx]); return r; })();
              if (!box) continue;
              const p = box.querySelector("x-layout-paragraph");
              if (!p) continue;
              p.renderMode = "canvas";
            }
            await new Promise(r => setTimeout(r, 200));
            canvases = page.querySelectorAll("x-layout-paragraph x-layout-canvas").length;
            let spans = 0;
            for (const p of page.querySelectorAll("x-layout-paragraph")) {
              for (const col of p.querySelectorAll("x-layout-column")) {
                spans += col.shadowRoot.querySelectorAll("span[data-source-offset]").length;
              }
            }
            return { switchMs: performance.now() - t0, canvases, spans };
          },
        },
      };

      document.title = "BENCH_READY";
    })();
  </script>
</body>

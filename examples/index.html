<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout Element Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #f0f0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        min-height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #toolbar button {
        padding: 8px 18px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.15s ease;
      }
      #toolbar button:hover {
        background: #f5f5f5;
        border-color: #999;
      }
      #toolbar button.active {
        background: #1a73e8;
        color: #fff;
        border-color: #1a73e8;
      }
      #toolbar button.active-layout {
        background: #e8451a;
        color: #fff;
        border-color: #e8451a;
      }
      #toolbar button.active-insert {
        background: #1a7e3a;
        color: #fff;
        border-color: #1a7e3a;
      }
      #toolbar button.active-layout-reparent {
        background: #7a1ae8;
        color: #fff;
        border-color: #7a1ae8;
      }
      #toolbar button.active-ai {
        background: #1a8e8e;
        color: #fff;
        border-color: #1a8e8e;
      }
      #toolbar select {
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      #info-panel {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
        min-width: 260px;
        max-width: 360px;
        font-size: 13px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        z-index: 10000;
      }
      #info-panel h3 {
        margin-bottom: 8px;
        font-size: 14px;
        color: #333;
      }
      #info-panel .section {
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #eee;
      }
      #info-panel .section:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }
      #info-panel .label {
        color: #888;
        font-size: 11px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      #info-panel .value {
        color: #333;
        font-weight: 500;
      }
      #info-panel .empty {
        color: #aaa;
        font-style: italic;
      }
      #info-panel .layout-item {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
      }
      #info-panel .layout-item .id {
        color: #1a73e8;
        font-family: monospace;
      }
      #info-panel .layout-item .type {
        color: #888;
        font-size: 11px;
      }
      #hint {
        margin-top: 8px;
        font-size: 12px;
        color: #888;
        text-align: center;
        max-width: 400px;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <div
        style="
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
          justify-content: center;
          width: 100%;
        "
      >
        <button id="btn-read" class="active">📄 읽기 모드</button>
        <button id="btn-edit">✏️ 텍스트 편집 모드</button>
        <button id="btn-layout">📐 레이아웃 편집 (move)</button>
        <button id="btn-layout-reparent">🔀 레이아웃 편집 (reparent)</button>
      </div>
      <div
        style="
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
          justify-content: center;
          width: 100%;
          margin-top: 8px;
        "
      >
        <select id="insert-type">
          <option value="box">📦 Box</option>
          <option value="text">📝 Text</option>
          <option value="paragraph">¶ Paragraph</option>
          <option value="image">🖼️ Image</option>
        </select>
        <select id="insert-position">
          <option value="absolute">Absolute</option>
          <option value="static">Static</option>
        </select>
        <button id="btn-insert">📥 삽입 모드</button>
      </div>
      <div
        style="
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
          justify-content: center;
          width: 100%;
          margin-top: 8px;
        "
      >
        <button id="btn-ai-toggle">🤖 AI 처리 오버레이 토글</button>
        <button id="btn-ai-paragraph">🤖 단락에만 표시</button>
        <button id="btn-ai-image">🤖 이미지에만 표시</button>
        <button id="btn-ai-clear">🤖 모두 해제</button>
      </div>
    </div>

    <div id="hint"></div>

    <x-layout-document id="doc"></x-layout-document>

    <div id="info-panel">
      <h3>📊 상태 패널</h3>
      <div class="section">
        <div class="label">포커스된 단락</div>
        <div id="focused-paragraph" class="value empty">없음</div>
      </div>
      <div class="section">
        <div class="label">커서 위치</div>
        <div id="cursor-offset" class="value empty">없음</div>
      </div>
      <div class="section">
        <div class="label">선택된 레이아웃</div>
        <div id="selected-layouts" class="value empty">없음</div>
      </div>
      <div class="section">
        <div class="label">선택된 레이아웃 ID</div>
        <div id="selected-layout-ids" class="value empty">없음</div>
      </div>
    </div>

    <script type="module">
      import "/src/index.ts";

      import { ColorRegistry } from "/src/resource/color-registry";
      import { FontLoader } from "/src/resource/font-loader";
      import { exampleData } from "/src/examples";

      (async () => {
        await ColorRegistry.getInstance().init();
        await FontLoader.getInstance().init();

        const doc = document.getElementById("doc");
        doc.data = exampleData;

        await doc.render();

        const btnRead = document.getElementById("btn-read");
        const btnEdit = document.getElementById("btn-edit");
        const btnLayout = document.getElementById("btn-layout");
        const btnLayoutReparent = document.getElementById(
          "btn-layout-reparent",
        );
        const btnInsert = document.getElementById("btn-insert");
        const btnAiToggle = document.getElementById("btn-ai-toggle");
        const btnAiParagraph = document.getElementById("btn-ai-paragraph");
        const btnAiImage = document.getElementById("btn-ai-image");
        const btnAiClear = document.getElementById("btn-ai-clear");
        const insertType = document.getElementById("insert-type");
        const insertPosition = document.getElementById("insert-position");
        const hint = document.getElementById("hint");

        let currentMode = "read";

        function clearAllEditMode() {
          em.textEditMode = false;
          em.layoutEditMode = false;
        }

        function clearLayoutActiveButtons() {
          btnLayout.classList.remove("active-layout");
          btnLayoutReparent.classList.remove("active-layout-reparent");
        }

        function clearInsertMode() {
          em.insertMode = null;
          btnInsert.classList.remove("active-insert");
          if (currentMode === "insert") {
            currentMode = "read";
          }
        }

        function setReadMode() {
          clearInsertMode();
          currentMode = "read";
          clearAllEditMode();
          btnRead.classList.add("active");
          btnEdit.classList.remove("active");
          clearLayoutActiveButtons();
          hint.textContent = "";
        }

        function setTextEditMode() {
          clearInsertMode();
          currentMode = "text";
          clearAllEditMode();
          em.setEditableTextRoles(["none"]);
          em.textEditMode = true;
          btnRead.classList.remove("active");
          btnEdit.classList.add("active");
          clearLayoutActiveButtons();
          hint.textContent = "단락을 클릭하여 텍스트를 편집할 수 있습니다.";
        }

        function setLayoutEditMode() {
          clearInsertMode();
          currentMode = "layout";
          clearAllEditMode();
          em.setEditableRoles(["none"]);
          em.layoutEditMode = true; // { type: 'move' }와 동일
          btnRead.classList.remove("active");
          btnEdit.classList.remove("active");
          clearLayoutActiveButtons();
          btnLayout.classList.add("active-layout");
          hint.textContent =
            "레이아웃 요소(box)를 드래그하여 이동할 수 있습니다. 클릭으로 선택, Ctrl+클릭으로 다중 선택.";
        }

        function setLayoutReparentMode() {
          clearInsertMode();
          currentMode = "layout-reparent";
          clearAllEditMode();
          em.setEditableRoles(["none"]);
          em.layoutEditMode = { type: "reparent" };
          btnRead.classList.remove("active");
          btnEdit.classList.remove("active");
          clearLayoutActiveButtons();
          btnLayoutReparent.classList.add("active-layout-reparent");
          hint.textContent =
            "reparent 모드: box를 드래그하여 다른 컨테이너로 옮기거나 빼낼 수 있습니다. mouseup 시 커서 위치의 컨테이너로 부모가 변경됩니다.";
        }

        function toggleInsertMode() {
          const isInsert = currentMode === "insert";
          if (isInsert) {
            setReadMode();
          } else {
            clearInsertMode();
            currentMode = "insert";
            clearAllEditMode();
            em.setEditableRoles(["none"]);
            em.layoutEditMode = true;
            btnRead.classList.remove("active");
            btnEdit.classList.remove("active");
            clearLayoutActiveButtons();
            btnLayout.classList.add("active-layout");
            btnInsert.classList.add("active-insert");
            em.insertMode = {
              type: insertType.value,
              position: insertPosition.value,
            };
            hint.textContent =
              "삽입 모드: 마우스 드래그로 요소를 그려서 삽입하세요. ESC로 취소.";
          }
        }

        btnRead.addEventListener("click", setReadMode);
        btnEdit.addEventListener("click", setTextEditMode);
        btnLayout.addEventListener("click", setLayoutEditMode);
        btnLayoutReparent.addEventListener("click", setLayoutReparentMode);
        btnInsert.addEventListener("click", toggleInsertMode);

        insertType.addEventListener("change", () => {
          if (currentMode === "insert") {
            em.insertMode = {
              type: insertType.value,
              position: insertPosition.value,
            };
          }
        });

        insertPosition.addEventListener("change", () => {
          if (currentMode === "insert") {
            em.insertMode = {
              type: insertType.value,
              position: insertPosition.value,
            };
          }
        });

        // AI 처리 오버레이 토글
        let aiActive = false;

        function getAllParagraphs() {
          return Array.from(doc.querySelectorAll("x-layout-paragraph"));
        }

        function getAllImages() {
          return Array.from(doc.querySelectorAll("x-layout-image"));
        }

        function setAiOverlay(paragraphs, images, active) {
          for (const p of paragraphs) p.aiProcessing = active;
          for (const i of images) i.aiProcessing = active;
        }

        btnAiToggle.addEventListener("click", () => {
          aiActive = !aiActive;
          setAiOverlay(getAllParagraphs(), getAllImages(), aiActive);
          btnAiToggle.classList.toggle("active-ai", aiActive);
          btnAiParagraph.classList.remove("active-ai");
          btnAiImage.classList.remove("active-ai");
          hint.textContent = aiActive
            ? "AI 처리 오버레이 표시 중. 버튼을 다시 누르면 해제됩니다."
            : "";
        });

        btnAiParagraph.addEventListener("click", () => {
          const wasParagraphOnly = btnAiParagraph.classList.contains("active-ai");
          setAiOverlay(getAllParagraphs(), [], !wasParagraphOnly);
          btnAiParagraph.classList.toggle("active-ai", !wasParagraphOnly);
          if (!wasParagraphOnly) {
            aiActive = false;
            btnAiToggle.classList.remove("active-ai");
            btnAiImage.classList.remove("active-ai");
            hint.textContent = "단락에만 AI 처리 오버레이 표시 중.";
          } else {
            hint.textContent = "";
          }
        });

        btnAiImage.addEventListener("click", () => {
          const wasImageOnly = btnAiImage.classList.contains("active-ai");
          setAiOverlay([], getAllImages(), !wasImageOnly);
          btnAiImage.classList.toggle("active-ai", !wasImageOnly);
          if (!wasImageOnly) {
            aiActive = false;
            btnAiToggle.classList.remove("active-ai");
            btnAiParagraph.classList.remove("active-ai");
            hint.textContent = "이미지에만 AI 처리 오버레이 표시 중.";
          } else {
            hint.textContent = "";
          }
        });

        btnAiClear.addEventListener("click", () => {
          aiActive = false;
          setAiOverlay(getAllParagraphs(), getAllImages(), false);
          btnAiToggle.classList.remove("active-ai");
          btnAiParagraph.classList.remove("active-ai");
          btnAiImage.classList.remove("active-ai");
          hint.textContent = "";
        });

        // EditManager 이벤트 수신 (문서 요소에서 per-document 인스턴스 획득)
        const docEl = document.querySelector('x-layout-document');
        const em = docEl?.editManager;
        if (!em) return;

        // 텍스트 편집 이벤트
        const textEventTypes = [
          "focusChange",
          "textChange",
          "styleChange",
          "cursorMove",
          "selectionStart",
          "selectionEnd",
        ];
        for (const type of textEventTypes) {
          em.addEventListener(type, (event) => {
            const detail =
              type === "focusChange"
                ? `from: ${event.previousParagraph?.id ?? "(null)"}`
                : `paragraph: ${event.paragraph.id}`;
            console.log(`[EditManager] ${type} — ${detail}`);
          });
        }

        // 레이아웃 선택 이벤트
        em.addEventListener("layoutSelectionChange", (event) => {
          console.log("[EditManager] layoutSelectionChange", {
            selected: event.selectedLayouts?.map((e) => ({
              id: e.id,
              type: e.type,
            })),
            previous: event.previousLayouts?.map((e) => ({
              id: e.id,
              type: e.type,
            })),
          });
          updateInfoPanel();
        });

        // 레이아웃 이동 이벤트
        em.addEventListener("layoutMove", (event) => {
          const reparentInfo = event.newContainer
            ? ` (reparent: ${event.previousContainer?.id ?? "(null)"} → ${event.newContainer.id})`
            : "";
          if (event.canceled) {
            console.log("[EditManager] layoutMove CANCELED", {
              element: {
                id: event.layoutElement?.id,
                type: event.layoutElement?.type,
              },
              previousLeft: event.previousLeft,
              previousTop: event.previousTop,
              left: event.left,
              top: event.top,
              canceled: event.canceled,
              newContainer: event.newContainer?.id,
              previousContainer: event.previousContainer?.id,
            });
          } else {
            console.log(
              `[EditManager] layoutMove${reparentInfo}`,
              {
                element: {
                  id: event.layoutElement?.id,
                  type: event.layoutElement?.type,
                },
                previousLeft: event.previousLeft,
                previousTop: event.previousTop,
                left: event.left,
                top: event.top,
                canceled: event.canceled,
                newContainer: event.newContainer?.id,
                previousContainer: event.previousContainer?.id,
              },
            );
          }
          updateInfoPanel();
        });

        // 포커스 변경 시에도 패널 업데이트
        em.addEventListener("focusChange", () => updateInfoPanel());
        em.addEventListener("cursorMove", () => updateInfoPanel());

        // 삽입 이벤트: 삽입 완료 후 레이아웃 편집 모드로 전환하고 삽입된 요소를 선택
        em.addEventListener("insert", (event) => {
          console.log("[EditManager] insert", {
            type: event.type,
            position: event.position,
            element: event.element,
            container: event.container,
            left: event.left,
            top: event.top,
            width: event.width,
            height: event.height,
            zIndex: event.zIndex,
          });

          // 삽입 모드 해제
          clearInsertMode();

          // 레이아웃 편집 모드로 전환 (기존 편집 상태 해제 후 활성화)
          clearAllEditMode();
          em.setEditableRoles(["none"]);
          em.layoutEditMode = true;
          btnRead.classList.remove("active");
          btnEdit.classList.remove("active");
          btnLayout.classList.add("active-layout");
          currentMode = "layout";
          hint.textContent =
            "레이아웃 요소(box)를 클릭하여 선택하세요. Ctrl+클릭으로 다중 선택.";

          // 삽입된 요소를 선택
          if (event.element) {
            em.selectLayout(event.element);
          }

          updateInfoPanel();
        });

        em.addEventListener("insertCancel", (event) => {
          console.log("[EditManager] insertCancel");
          clearInsertMode();
          setReadMode();
        });

        // 정보 패널 업데이트
        const elFocusedParagraph = document.getElementById("focused-paragraph");
        const elCursorOffset = document.getElementById("cursor-offset");
        const elSelectedLayouts = document.getElementById("selected-layouts");
        const elSelectedLayoutIds = document.getElementById(
          "selected-layout-ids",
        );

        function updateInfoPanel() {
          // 포커스된 단락
          const focusedP = em.focusedParagraph;
          if (focusedP) {
            elFocusedParagraph.textContent = focusedP.id || "(no id)";
            elFocusedParagraph.classList.remove("empty");
          } else {
            elFocusedParagraph.textContent = "없음";
            elFocusedParagraph.classList.add("empty");
          }

          // 커서 위치
          const cursor = em.cursorOffset;
          if (cursor !== null) {
            elCursorOffset.textContent = String(cursor);
            elCursorOffset.classList.remove("empty");
          } else {
            elCursorOffset.textContent = "없음";
            elCursorOffset.classList.add("empty");
          }

          // 선택된 레이아웃
          const layouts = em.selectedLayouts;
          if (layouts.length > 0) {
            elSelectedLayouts.innerHTML = layouts
              .map(
                (l) =>
                  `<div class="layout-item"><span class="id">${l.id || "(no id)"}</span><span class="type">${l.type}</span></div>`,
              )
              .join("");
            elSelectedLayouts.classList.remove("empty");
          } else {
            elSelectedLayouts.textContent = "없음";
            elSelectedLayouts.classList.add("empty");
          }

          // 선택된 레이아웃 ID
          const ids = em.selectedLayoutIds;
          if (ids.length > 0) {
            elSelectedLayoutIds.textContent = `[${ids.join(", ")}]`;
            elSelectedLayoutIds.classList.remove("empty");
          } else {
            elSelectedLayoutIds.textContent = "없음";
            elSelectedLayoutIds.classList.add("empty");
          }
        }

        updateInfoPanel();
      })();
    </script>
  </body>
</html>

      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
      font-family:

    }

    #toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #toolbar button {
      padding: 8px 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s ease;
    }

    #toolbar button:hover {
      background: #f5f5f5;
      border-color: #999;
    }

    #toolbar button.active {
      background: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
    }

    #toolbar button.active-layout {
      background: #e8451a;
      color: #fff;
      border-color: #e8451a;
    }

    #toolbar button.active-insert {
      background: #1a7e3a;
      color: #fff;
      border-color: #1a7e3a;
    }

    #toolbar button.active-layout-reparent {
      background: #7a1ae8;
      color: #fff;
      border-color: #7a1ae8;
    }

    #toolbar button.active-ai {
      background: #1a8e8e;
      color: #fff;
      border-color: #1a8e8e;
    }

    #toolbar select {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    #info-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      min-width: 260px;
      max-width: 360px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      z-index: 10000;
    }

    #info-panel h3 {
      margin-bottom: 8px;
      font-size: 14px;
      color: #333;
    }

    #info-panel .section {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    #info-panel .section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    #info-panel .label {
      color: #888;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    #info-panel .value {
      color: #333;
      font-weight: 500;
    }

    #info-panel .empty {
      color: #aaa;
      font-style: italic;
    }

    #info-panel .layout-item {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }

    #info-panel .layout-item .id {
      color: #1a73e8;
      font-family: monospace;
    }

    #info-panel .layout-item .type {
      color: #888;
      font-size: 11px;
    }

    #hint {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
      text-align: center;
      max-width: 400px;
    }

                  "id": "5zhhw6smj5eq",
                  "content": "SK하이닉스가 사상 최대 분기 실적을 내며 최근 확산한 인공지능(AI) 과열론 진화에 나섰다. 고대역폭메모리(HBM)를 비롯한 고사양 메모리 공급 부족이 이어지면서 올해 연간 영업이익은 300조원에 육박할 전망이다. 다만 중장기 실적을 좌우할 빅테크(대형 정보기술 기업)들의 AI 투자 지속가능성이 변수로 꼽힌다.\n◇HBM4 출하 본격화…메모리 공급 부족 2028년까지= 송현종 SK하이닉스 사장은 29일 2분기 실적발표 콘퍼런스콜에서 \"주요 빅테크 고객들은 AI 서비스 사용량 증가와 컴퓨팅 용량 부족으로 인프라 투자를 확대하고 있고, AI 서비스에서 창출되는 매출과 수익 성장을 바탕으로 메모리 구매를 지속해서 확대하고 있다\"며 \"HBM4는 2분기부터 양산 출하를 시작했으며, 하반기에는 생산을 본격적으로 확대할 계획\"이라고 밝혔다.\n반도체 업계는 SK하이닉스의 실적 상승세가 하반기까지 이어질 가능성이 높다고 보고 있다. HBM과 서버용 D램, 기업용 솔리드스테이트드라이브(eSSD) 등 AI 데이터센터용 고사양 제품 공급이 수요 증가를 따라가지 못하고 있어서다. 메모리 업체들이 HBM 생산을 늘릴수록 범용 D램 생산 여력이 줄어드는 점도 D램 가격 상승을 뒷받침한다.\n글로벌 투자은행(IB) 모건스탠리는 올해 3분기 메모리 반도체 가격이 전 분기보다 최소 25% 이상 상승할 것으로 예상했다. AI 서버 증설이 계속되는 반면 신규 생산설비가 공급 증가로 이어지는 데 시간이 필요한 만큼 공급 부족이 2028년까지 이어질 수 있다는 분석이다.\n주요 빅테크들이 장기공급계약(LTA)으로 AI 인프라에 필요한 메모리 물량을 선제 확보하면서 메모리 업황의 가시성도 높아졌다. SK그룹과 삼성전자 등 국내 기업들이 최근 미국 실리콘밸리에서 글로벌 빅테크들과 5년 단위의 대규모 AI 인프라 협력 구상을 발표한 것도 HBM과 서버용 메모리 수요 지속 기대를 키우고 있다.\n이에 하반기 실적은 HBM 출하량 증가와 범용 메모리 가격 상승이 함께 이끄는 구조가 될 전망이다. HBM과 eSSD 등 고부가가치 제품 비중이 높아지면서 매출 증가율을 웃도는 수익성 개선도 가능하다.\n증권가에서는 SK하이닉스의 올해 실적 전망치를 잇따라 상향했다. 현재 가격과 출하량 증가세가 유지되면 연간 영업이익이 300조원에 근접할 수 있다는 관측이다. 하나증권은 올해 영업이익을 294조원, 내년을 435조원으로 전망했다. KB증권도 지난 5월 올해와 내년 전망치를 각각 280조원, 454조원으로 높였다.\n◇실적보다 지속 가능성, 빅테크 투자·중국 추격에 촉각= 하지만 시장은 경계를 늦추지 않고 있다. 실적 발표를 하루 앞둔 28일 국내 증시에서 삼성전자와 SK하이닉스를 비롯한 반도체주가 급락했다. 29일 오전 10시20분 기준 SK하이닉스는 전 거래일보다 4.52% 내린 148만원에 거래됐다. AI 관련 기업들의 주가와 투자 규모가 실질적인 수익성을 넘어 빠르게 상승한 것 아니냐는 경계감이 커진 모습이다. 최근 뉴욕증권거래소에 상장된 SK하이닉스 미국주식예탁증서(ADR)가 국내 주식보다 16~51% 높은 가격에 거래되며 AI 투자 과열 사례로 지목되기도 했다.\n중국 반도체 업체들의 추격도 투자 심리에 영향을 미치고 있다. 중국 최대 메모리 업체 창신메모리테크놀로지(CXMT)가 상장과 동시에 본토 증시 1위에 올랐고, 국영 기업과 스타트업이 액침 심자외선(DUV) 노광장비 소량 양산에 돌입했다는 소식이 전해졌다.\n이날 콘퍼런스콜에서는 AI 인프라 투자 축소와 생산능력(캐파) 확대로 인한 공급 과잉 우려에 대한 질문이 쏟아졌다. SK하이닉스 관계자는 일부 빅테크의 데이터센터 임대 사업 검토나 고효율 AI 모델의 등장에 따른 투자 둔화 우려를 알고 있다며 \"AI 투자의 축소 과정이라기보다는 그동안 대규모로 구축해 온 AI 인프라의 활용도를 높이고 수익화를 본격화하는 과정으로 보고 있다\"고 답했다. 고효율 AI 모델로 AI 서비스 접근성이 높아지면 수요가 더 커질 것이라는 분석이다.\n공급 과잉 우려에 대해서도 \"회사 캐파 확대가 탄력적으로 이뤄질 계획인 만큼 중장기 투자가 공급 과잉으로 곧바로 이어질 가능성은 제한적\"이라며 \"실제 장비 투자와 생산능력은 고객 수요의 가시성과 투자 효율성 등을 종합적으로 고려해 단계적으로 진행할 계획\"이라고 밝혔다.\n미래에셋증권은 이날 목표주가를 420만원에서 280만원으로 33% 하향했다. 중국 CXMT 상장과 노광기 국산화로 레거시 제품에 대한 심리적 둔화가 동반될 수 있다는 이유에서다. 김영건 미래에셋증권 연구원은 \"메모리 평균 가격(ASP)은 내년에도 상승할 전망이나, 상승의 폭은 올해보다 완화될 것이 불가피해 보인다\"며 \"이젠 높아진 수익성의 지속 가능성에 주목해야 할 시기\"라고 분석했다.",

      await doc.render();

      const btnRead = document.getElementById("btn-read");
      const btnEdit = document.getElementById("btn-edit");
      const btnLayout = document.getElementById("btn-layout");
      const btnLayoutReparent = document.getElementById(
        "btn-layout-reparent",
      );
      const btnInsert = document.getElementById("btn-insert");
      const btnAiToggle = document.getElementById("btn-ai-toggle");
      const btnAiParagraph = document.getElementById("btn-ai-paragraph");
      const btnAiImage = document.getElementById("btn-ai-image");
      const btnAiClear = document.getElementById("btn-ai-clear");
      const insertType = document.getElementById("insert-type");
      const insertPosition = document.getElementById("insert-position");
      const hint = document.getElementById("hint");

      let currentMode = "read";

      function clearAllEditMode() {
        em.textEditMode = false;
        em.layoutEditMode = false;
      }

      function clearLayoutActiveButtons() {
        btnLayout.classList.remove("active-layout");
        btnLayoutReparent.classList.remove("active-layout-reparent");
      }

      function clearInsertMode() {
        em.insertMode = null;
        btnInsert.classList.remove("active-insert");
        if (currentMode === "insert") {
          currentMode = "read";
        }
      }

      function setReadMode() {
        clearInsertMode();
        currentMode = "read";
        clearAllEditMode();
        btnRead.classList.add("active");
        btnEdit.classList.remove("active");
        clearLayoutActiveButtons();
        hint.textContent = "";
      }

      function setTextEditMode() {
        clearInsertMode();
        currentMode = "text";
        clearAllEditMode();
        em.setEditableTextRoles(["none"]);
        em.textEditMode = true;
        btnRead.classList.remove("active");
        btnEdit.classList.add("active");
        clearLayoutActiveButtons();
        hint.textContent = "단락을 클릭하여 텍스트를 편집할 수 있습니다.";
      }

      function setLayoutEditMode() {
        clearInsertMode();
        currentMode = "layout";
        clearAllEditMode();
        em.setEditableRoles(["none"]);
        em.layoutEditMode = true; // { type: 'move' }와 동일
        btnRead.classList.remove("active");
        btnEdit.classList.remove("active");
        clearLayoutActiveButtons();
        btnLayout.classList.add("active-layout");
        hint.textContent =
          "레이아웃 요소(box)를 드래그하여 이동할 수 있습니다. 클릭으로 선택, Ctrl+클릭으로 다중 선택.";
      }

      function setLayoutReparentMode() {
        clearInsertMode();
        currentMode = "layout-reparent";
        clearAllEditMode();
        em.setEditableRoles(["none"]);
        em.layoutEditMode = { type: "reparent" };
        btnRead.classList.remove("active");
        btnEdit.classList.remove("active");
        clearLayoutActiveButtons();
        btnLayoutReparent.classList.add("active-layout-reparent");
        hint.textContent =
          "reparent 모드: box를 드래그하여 다른 컨테이너로 옮기거나 빼낼 수 있습니다. mouseup 시 커서 위치의 컨테이너로 부모가 변경됩니다.";
      }

      function toggleInsertMode() {
        const isInsert = currentMode === "insert";
        if (isInsert) {
          setReadMode();
        } else {
          clearInsertMode();
          currentMode = "insert";
          clearAllEditMode();
          em.setEditableRoles(["none"]);
          em.layoutEditMode = true;
          btnRead.classList.remove("active");
          btnEdit.classList.remove("active");
          clearLayoutActiveButtons();
          btnLayout.classList.add("active-layout");
          btnInsert.classList.add("active-insert");
          em.insertMode = {
            type: insertType.value,
            position: insertPosition.value,
          };
          hint.textContent =
            "삽입 모드: 마우스 드래그로 요소를 그려서 삽입하세요. ESC로 취소.";
        }
      }

      btnRead.addEventListener("click", setReadMode);
      btnEdit.addEventListener("click", setTextEditMode);
      btnLayout.addEventListener("click", setLayoutEditMode);
      btnLayoutReparent.addEventListener("click", setLayoutReparentMode);
      btnInsert.addEventListener("click", toggleInsertMode);

      insertType.addEventListener("change", () => {
        if (currentMode === "insert") {
          em.insertMode = {
            type: insertType.value,
            position: insertPosition.value,
          };
        }
      });

      insertPosition.addEventListener("change", () => {
        if (currentMode === "insert") {
          em.insertMode = {
            type: insertType.value,
            position: insertPosition.value,
          };
        }
      });

      // AI 처리 오버레이 토글
      let aiActive = false;

      function getAllParagraphs() {
        return Array.from(doc.querySelectorAll("x-layout-paragraph"));
      }

      function getAllImages() {
        return Array.from(doc.querySelectorAll("x-layout-image"));
      }

      function setAiOverlay(paragraphs, images, active) {
        for (const p of paragraphs) p.aiProcessing = active;
        for (const i of images) i.aiProcessing = active;
      }

      btnAiToggle.addEventListener("click", () => {
        aiActive = !aiActive;
        setAiOverlay(getAllParagraphs(), getAllImages(), aiActive);
        btnAiToggle.classList.toggle("active-ai", aiActive);
        btnAiParagraph.classList.remove("active-ai");
        btnAiImage.classList.remove("active-ai");
        hint.textContent = aiActive
          ? "AI 처리 오버레이 표시 중. 버튼을 다시 누르면 해제됩니다."
          : "";
      });

      btnAiParagraph.addEventListener("click", () => {
        const wasParagraphOnly = btnAiParagraph.classList.contains("active-ai");
        setAiOverlay(getAllParagraphs(), [], !wasParagraphOnly);
        btnAiParagraph.classList.toggle("active-ai", !wasParagraphOnly);
        if (!wasParagraphOnly) {
          aiActive = false;
          btnAiToggle.classList.remove("active-ai");
          btnAiImage.classList.remove("active-ai");
          hint.textContent = "단락에만 AI 처리 오버레이 표시 중.";
        } else {
          hint.textContent = "";
        }
      });

      btnAiImage.addEventListener("click", () => {
        const wasImageOnly = btnAiImage.classList.contains("active-ai");
        setAiOverlay([], getAllImages(), !wasImageOnly);
        btnAiImage.classList.toggle("active-ai", !wasImageOnly);
        if (!wasImageOnly) {
          aiActive = false;
          btnAiToggle.classList.remove("active-ai");
          btnAiParagraph.classList.remove("active-ai");
          hint.textContent = "이미지에만 AI 처리 오버레이 표시 중.";
        } else {
          hint.textContent = "";
        }
      });

      btnAiClear.addEventListener("click", () => {
        aiActive = false;
        setAiOverlay(getAllParagraphs(), getAllImages(), false);
        btnAiToggle.classList.remove("active-ai");
        btnAiParagraph.classList.remove("active-ai");
        btnAiImage.classList.remove("active-ai");
        hint.textContent = "";
      });

      // EditManager 이벤트 수신 (문서 요소에서 per-document 인스턴스 획득)
      const docEl = document.querySelector('x-layout-document');
      const em = docEl?.editManager;
      if (!em) return;

      // 텍스트 편집 이벤트
      const textEventTypes = [
        "focusChange",
        "textChange",
        "styleChange",
        "cursorMove",
        "selectionStart",
        "selectionEnd",
      ];
      for (const type of textEventTypes) {
        em.addEventListener(type, (event) => {
          const detail =
            type === "focusChange"
              ? `from: ${event.previousParagraph?.id ?? "(null)"}`
              : `paragraph: ${event.paragraph.id}`;
          console.log(`[EditManager] ${type} — ${detail}`);
        });
      }

      // 레이아웃 선택 이벤트
      em.addEventListener("layoutSelectionChange", (event) => {
        console.log("[EditManager] layoutSelectionChange", {
          selected: event.selectedLayouts?.map((e) => ({
            id: e.id,
            type: e.type,
          })),
          previous: event.previousLayouts?.map((e) => ({
            id: e.id,
            type: e.type,
          })),
        });
        updateInfoPanel();
      });

      // 레이아웃 이동 이벤트
      em.addEventListener("layoutMove", (event) => {
        const reparentInfo = event.newContainer
          ? ` (reparent: ${event.previousContainer?.id ?? "(null)"} → ${event.newContainer.id})`
          : "";
        if (event.canceled) {
          console.log("[EditManager] layoutMove CANCELED", {
            element: {
              id: event.layoutElement?.id,
              type: event.layoutElement?.type,
            },
            previousLeft: event.previousLeft,
            previousTop: event.previousTop,
            left: event.left,
            top: event.top,
            canceled: event.canceled,
            newContainer: event.newContainer?.id,
            previousContainer: event.previousContainer?.id,
          });
        } else {
          console.log(
            `[EditManager] layoutMove${reparentInfo}`,
            {
              element: {
                id: event.layoutElement?.id,
                type: event.layoutElement?.type,
              },
              previousLeft: event.previousLeft,
              previousTop: event.previousTop,
              left: event.left,
              top: event.top,
              canceled: event.canceled,
              newContainer: event.newContainer?.id,
              previousContainer: event.previousContainer?.id,
            },
          );
        }
        updateInfoPanel();
      });

      // 포커스 변경 시에도 패널 업데이트
      em.addEventListener("focusChange", () => updateInfoPanel());
      em.addEventListener("cursorMove", () => updateInfoPanel());

      // 삽입 이벤트: 삽입 완료 후 레이아웃 편집 모드로 전환하고 삽입된 요소를 선택
      em.addEventListener("insert", (event) => {
        console.log("[EditManager] insert", {
          type: event.type,
          position: event.position,
          element: event.element,
          container: event.container,
          left: event.left,
          top: event.top,
          width: event.width,
          height: event.height,
          zIndex: event.zIndex,
        });

        // 삽입 모드 해제
        clearInsertMode();

        // 레이아웃 편집 모드로 전환 (기존 편집 상태 해제 후 활성화)
        clearAllEditMode();
        em.setEditableRoles(["none"]);
        em.layoutEditMode = true;
        btnRead.classList.remove("active");
        btnEdit.classList.remove("active");
        btnLayout.classList.add("active-layout");
        currentMode = "layout";
        hint.textContent =
          "레이아웃 요소(box)를 클릭하여 선택하세요. Ctrl+클릭으로 다중 선택.";

        // 삽입된 요소를 선택
        if (event.element) {
          em.selectLayout(event.element);
        }

        updateInfoPanel();
      });

      em.addEventListener("insertCancel", (event) => {
        console.log("[EditManager] insertCancel");
        clearInsertMode();
        setReadMode();
      });

      // 정보 패널 업데이트
      const elFocusedParagraph = document.getElementById("focused-paragraph");
      const elCursorOffset = document.getElementById("cursor-offset");
      const elSelectedLayouts = document.getElementById("selected-layouts");
      const elSelectedLayoutIds = document.getElementById(
        "selected-layout-ids",
      );

      function updateInfoPanel() {
        // 포커스된 단락
        const focusedP = em.focusedParagraph;
        if (focusedP) {
          elFocusedParagraph.textContent = focusedP.id || "(no id)";
          elFocusedParagraph.classList.remove("empty");
        } else {
          elFocusedParagraph.textContent = "없음";
          elFocusedParagraph.classList.add("empty");
        }

        // 커서 위치
        const cursor = em.cursorOffset;
        if (cursor !== null) {
          elCursorOffset.textContent = String(cursor);
          elCursorOffset.classList.remove("empty");
        } else {
          elCursorOffset.textContent = "없음";
          elCursorOffset.classList.add("empty");
        }

        // 선택된 레이아웃
        const layouts = em.selectedLayouts;
        if (layouts.length > 0) {
          elSelectedLayouts.innerHTML = layouts
            .map(
              (l) =>
                `<div class="layout-item"><span class="id">${l.id || "(no id)"}</span><span class="type">${l.type}</span></div>`,
            )
            .join("");
          elSelectedLayouts.classList.remove("empty");
        } else {
          elSelectedLayouts.textContent = "없음";
          elSelectedLayouts.classList.add("empty");
        }

        // 선택된 레이아웃 ID
        const ids = em.selectedLayoutIds;
        if (ids.length > 0) {
          elSelectedLayoutIds.textContent = `[${ids.join(", ")}]`;
          elSelectedLayoutIds.classList.remove("empty");
        } else {
          elSelectedLayoutIds.textContent = "없음";
          elSelectedLayoutIds.classList.add("empty");
        }
      }

      // 테이블 테스트 버튼
      const btnTblInsertRowBelow = document.getElementById("btn-tbl-insert-row-below");
      const btnTblInsertRowAbove = document.getElementById("btn-tbl-insert-row-above");
      const btnTblInsertColRight = document.getElementById("btn-tbl-insert-col-right");
      const btnTblInsertColLeft = document.getElementById("btn-tbl-insert-col-left");
      const btnTblDeleteRow = document.getElementById("btn-tbl-delete-row");
      const btnTblDeleteCol = document.getElementById("btn-tbl-delete-col");
      const btnTblCheck = document.getElementById("btn-tbl-check");

      function getTableAndKc() {
        const table = doc.querySelector("x-layout-table");
        if (!table) {
          hint.textContent = "테이블이 없습니다.";
          return null;
        }
        const kc = table.keyboardController;
        if (!kc) {
          hint.textContent = "keyboardController가 없습니다.";
          return null;
        }
        if (!kc.selection) {
          hint.textContent = "셀을 먼저 선택하세요. (F5로 셀 블록 모드 진입 후 화살표로 선택)";
          return null;
        }
        return { table, kc };
      }

      function runTableAction(label, fn) {
        const ctx = getTableAndKc();
        if (!ctx) return;
        const { table, kc } = ctx;
        const before = { rows: table.gridResolution?.rowCount, cols: table.gridResolution?.colWidths?.length };
        try {
          fn(kc);
          requestAnimationFrame(() => {
            setTimeout(() => {
              const after = { rows: table.gridResolution?.rowCount, cols: table.gridResolution?.colWidths?.length };
              const trs = table.querySelectorAll("x-layout-tr");
              const badCells = [];
              for (let r = 0; r < trs.length; r++) {
                const tds = trs[r].querySelectorAll("x-layout-td");
                for (let c = 0; c < tds.length; c++) {
                  const box = tds[c].items[0];
                  const styleEl = box?.shadowRoot?.querySelector("style");
                  const ruleCount = styleEl?.sheet?.cssRules?.length ?? 0;
                  if (ruleCount === 0) {
                    badCells.push(`r${r}c${c}`);
                  }
                }
              }
              hint.textContent = `${label}: ${before.rows}x${before.cols} → ${after.rows}x${after.cols}` +
                (badCells.length > 0 ? ` | 규칙 0개: ${badCells.join(", ")}` : " | 모든 셀 정상 ✅");
            }, 100);
          });
        } catch (e) {
          hint.textContent = `${label} 에러: ${e.message}`;
        }
      }

      btnTblInsertRowBelow.addEventListener("click", () => runTableAction("행 아래 삽입", (kc) => kc.insertRowBelow()));
      btnTblInsertRowAbove.addEventListener("click", () => runTableAction("행 위 삽입", (kc) => kc.insertRowAbove()));
      btnTblInsertColRight.addEventListener("click", () => runTableAction("열 오른쪽 삽입", (kc) => kc.insertColRight()));
      btnTblInsertColLeft.addEventListener("click", () => runTableAction("열 왼쪽 삽입", (kc) => kc.insertColLeft()));
      btnTblDeleteRow.addEventListener("click", () => runTableAction("행 삭제", (kc) => kc.deleteRow()));
      btnTblDeleteCol.addEventListener("click", () => runTableAction("열 삭제", (kc) => kc.deleteCol()));

      btnTblCheck.addEventListener("click", () => {
        const table = doc.querySelector("x-layout-table");
        if (!table) {
          hint.textContent = "테이블이 없습니다.";
          return;
        }
        const trs = table.querySelectorAll("x-layout-tr");
        const info = [];
        for (let r = 0; r < trs.length; r++) {
          const tds = trs[r].querySelectorAll("x-layout-td");
          for (let c = 0; c < tds.length; c++) {
            const box = tds[c].items[0];
            const styleEl = box?.shadowRoot?.querySelector("style");
            const ruleCount = styleEl?.sheet?.cssRules?.length ?? 0;
            const hostRule = styleEl?.sheet?.cssRules?.[0];
            const hostWidth = hostRule?.style?.width ?? "";
            info.push(`r${r}c${c}:${ruleCount}규칙/${hostWidth}`);
          }
        }
        hint.textContent = info.join(" | ");
      });

      updateInfoPanel();
    })();
  </script>

  <div id="table-log" style="position:fixed;bottom:0;right:0;width:400px;max-height:200px;overflow:auto;background:rgba(0,0,0,0.85);color:#0f0;font-family:monospace;font-size:12px;padding:8px;z-index:999999;border-radius:8px 0 0 0;"></div>
  <script>
    (function() {
      const logEl = document.getElementById('table-log');
      window._tableLog = function(msg) {
        const time = new Date().toLocaleTimeString();
        const line = document.createElement('div');
        line.textContent = `[${time}] ${msg}`;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
        while (logEl.children.length > 50) logEl.removeChild(logEl.firstChild);
      };
      window._tableLog('로그 패널 초기화됨');

      document.addEventListener('keydown', function(e) {
        const doc = document.querySelector('x-layout-document');
        if (!doc || !doc.editManager?.layoutEditMode) return;
        const table = doc.querySelector('x-layout-table');
        if (!table) return;

        const key = e.key;
        const isTableKey = ['F5','F7','F8','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','m','M','s','S','w','W','h','H','Insert','Delete','Escape'].includes(key) ||
          (e.altKey && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Insert','Delete'].includes(key));
        if (!isTableKey) return;

        const kc = table.keyboardController;
        const sel = kc?.selection;
        const selInfo = sel ? `${sel.mode} anchor={${sel.anchor.row},${sel.anchor.col}} focus={${sel.focus.row},${sel.focus.col}} selectMode=${sel.selectMode||'cell'}` : 'null';

        const mod = (e.altKey?'Alt+':'') + (e.ctrlKey?'Ctrl+':'') + (e.shiftKey?'Shift+':'');
        window._tableLog(`KEY: ${mod}${key} | SEL: ${selInfo}`);

        setTimeout(function() {
          const sel2 = kc?.selection;
          const sel2Info = sel2 ? `${sel2.mode} anchor={${sel2.anchor.row},${sel2.anchor.col}} focus={${sel2.focus.row},${sel2.focus.col}}` : 'null';
          const circles = table.shadowRoot?.querySelectorAll('[data-cell]');
          window._tableLog(`  → SEL: ${sel2Info} | CIRCLES: ${circles?.length||0}`);
        }, 50);
      }, true);
    })();
  </script>
</body>
